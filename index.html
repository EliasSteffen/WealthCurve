<html lang="de">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zinseszins – Sparplan visualisiert</title>

      name="description"
      content="Wie sich Sparrate, Rendite und Zeit auf das Vermögen auswirken – mit echten Kursverläufen, Szenarienvergleich und Video-Export."

    <!--
      Alle Symbole stammen aus src/render/logo.ts und werden von `npm run icons`
      erzeugt. Das SVG deckt jede Größe ab; die PNGs sind für die Stellen, an

    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Die Fläche um die Seite herum folgt dem gewählten Thema. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141413" />
  </head>
